services:
  server:
    build: ./server
    image: claude-burn-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      BURN_TOKEN: ${BURN_TOKEN:?set BURN_TOKEN in .env}
      BURN_TZ: ${BURN_TZ:-UTC}
      BURN_STALE_MIN: ${BURN_STALE_MIN:-180}
      BURN_DB: /data/burn.db
      PORT: "8080"
    volumes:
      - burn-data:/data

volumes:
  burn-data:
